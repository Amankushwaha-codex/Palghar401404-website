            const [ch, cm] = hours.close.split(':').map(Number);
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const openMin = oh * 60 + om, closeMin = ch * 60 + cm;
            if (closeMin < openMin) return nowMin >= openMin || nowMin <= closeMin;
            return nowMin >= openMin && nowMin <= closeMin;

        /* ===================== ROUTER ===================== */
        function parseRoute() {
            const hash = location.hash.replace(/^#/, '') || '/';
            const parts = hash.split('/').filter(Boolean);
            return parts;
        }

        function setActiveNav(route) {
            document.querySelectorAll('.nav-link').forEach(a => {
                const isActive = a.dataset.route === route;
                a.classList.toggle('text-primary', isActive);
                a.classList.toggle('text-gray-500', !isActive);
            });
        }

        function render() {
            const parts = parseRoute();
            const app = document.getElementById('app');
            window.scrollTo(0, 0);

            if (parts.length === 0) {
                app.innerHTML = renderHome();
                setActiveNav('/');
                bindHomeEvents();
            } else if (parts[0] === 'categories') {
                app.innerHTML = renderCategories();
                setActiveNav('/categories');
            } else if (parts[0] === 'search') {
                const q = decodeURIComponent(parts[1] || '');
                app.innerHTML = renderSearch(q);
                setActiveNav('/search');
                bindSearchEvents();
            } else if (parts[0] === 'emergency') {
                app.innerHTML = renderEmergency();
                setActiveNav('');
            } else if (parts[0] === 'category' && parts[1]) {
                app.innerHTML = renderCategoryPage(parts[1]);
                setActiveNav('');
                bindCategoryEvents(parts[1]);
            } else if (parts[0] === 'business' && parts[1]) {
                app.innerHTML = renderBusinessDetail(Number(parts[1]));
                setActiveNav('');
                bindReviewForm(Number(parts[1]));
            } else if (parts[0] === 'add-business') {
                app.innerHTML = renderAddBusiness();
                setActiveNav('/add-business');
                bindAddBusinessForm();
            } else if (parts[0] === 'account') {
                app.innerHTML = renderAccount();
                setActiveNav('/account');
            } else {
                app.innerHTML = `<div class="px-4 pt-10 text-center text-gray-500">Page not found. <a href="#/" class="text-primary underline">Go Home</a></div>`;
                setActiveNav('');
            }
        }

        function bindHomeEvents() {
            const searchInput = document.getElementById('homeSearch');
            searchInput?.addEventListener('keypress', e => {
                if (e.key === 'Enter' && searchInput.value.trim()) {
                    location.hash = '#/search/' + encodeURIComponent(searchInput.value.trim());
                }
            });
            document.getElementById('homeArea')?.addEventListener('change', e => {state.area = e.target.value; updateHomeDynamic();});
            document.getElementById('btnOpenNow')?.addEventListener('click', e => {
                state.openOnly = !state.openOnly;
                e.target.classList.toggle('bg-accent'); e.target.classList.toggle('text-white'); e.target.classList.toggle('bg-white'); e.target.classList.toggle('text-primary');
                updateHomeDynamic();
            });
            document.getElementById('btnNearMe')?.addEventListener('click', e => {
                if (!navigator.geolocation) {alert('Geolocation not supported'); return;}
                e.target.textContent = 'Locating...';
                navigator.geolocation.getCurrentPosition(pos => {
                    state.coords = {lat: pos.coords.latitude, lng: pos.coords.longitude};
                    state.nearMe = true;
                    e.target.textContent = '📍 ' + t('nearMe');
                    e.target.classList.add('bg-accent', 'text-white'); e.target.classList.remove('bg-white', 'text-primary');
                    updateHomeDynamic();
                }, () => {alert('Could not get your location'); e.target.textContent = '📍 ' + t('nearMe');});
            });
            updateHomeDynamic();
        }

        function bindSearchEvents() {
            const input = document.getElementById('searchInput');
            input?.addEventListener('input', e => {
                const q = e.target.value;
                const results = q.trim() ? businesses.filter(b => {
                    const c = catOf(b.category); const s = q.toLowerCase();
                    return b.name.toLowerCase().includes(s) || b.area.toLowerCase().includes(s) ||
                        (c && c.en.toLowerCase().includes(s)) || b.tags.some(tg => tg.toLowerCase().includes(s));
                }) : [];
                document.getElementById('searchResults').innerHTML = q && results.length === 0
                    ? `<p class="text-gray-500 text-center py-10">No results for "${escapeHtml(q)}"</p>`
                    : results.map(cardHTML).join('');
                history.replaceState(null, '', '#/search/' + encodeURIComponent(q));
            });
        }

        function bindCategoryEvents(slug) {
            document.getElementById('catSearch')?.addEventListener('input', () => filterCategoryResults(slug));
            document.getElementById('catArea')?.addEventListener('change', () => filterCategoryResults(slug));
            document.getElementById('cat247')?.addEventListener('click', e => {
                e.target.classList.toggle('bg-primary'); e.target.classList.toggle('text-white');
                filterCategoryResults(slug);
            });
        }

        function bindReviewForm(id) {
            document.getElementById('reviewForm')?.addEventListener('submit', e => {
                e.preventDefault();
                const name = document.getElementById('rvName').value.trim();
                const comment = document.getElementById('rvComment').value.trim();
                const rating = Number(document.getElementById('rvRating').value);
                if (!name || !comment) return;
                const b = businesses.find(x => x.id === id);
                b.reviews.push({user: name, rating, comment, date: new Date().toISOString().slice(0, 10)});
                document.getElementById('reviewsList').innerHTML = renderReviewsList(b);
                e.target.reset();
                // TODO: supabase.from('reviews').insert({ business_id:id, user:name, rating, comment })
            });
        }

        function bindAddBusinessForm() {
            document.getElementById('addBizForm')?.addEventListener('submit', e => {
                e.preventDefault();
                // TODO: upload photos + supabase.from('businesses').insert({ ...fields, status:'pending' })
                document.getElementById('addBusinessWrap').innerHTML = `
      <div class="text-center pt-16">
        <div class="text-5xl mb-4">✅</div>
        <h1 class="text-xl font-bold text-gray-800">Thank you!</h1>
        <p class="text-gray-600 mt-2">Your business has been submitted. Our team will review and publish it within 24 hours.</p>
        <a href="#/" class="inline-block mt-6 bg-primary text-white px-5 py-2 rounded-xl font-semibold">Back to Home</a>
      </div>`;
            });
        }

        /* ===================== LANGUAGE ===================== */
        document.getElementById('langSelect').addEventListener('change', e => {
            state.lang = e.target.value;
            localStorage.setItem('pj_lang', state.lang);
            render();
        });

        /* ===================== INIT ===================== */
        window.addEventListener('hashchange', render);
        window.addEventListener('DOMContentLoaded', render);
        render();
    </script>
</body>

</html>
